# herdr — keybindings ported from tmux (~/.dotfiles/tmux/.tmux.conf)
# https://herdr.dev/docs/configuration/#keybindings

onboarding = false

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: bind-key h/j/k/l select-pane
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux: bind | split-window -h ; bind - split-window -v
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# herdr defaults kept:
# resize_mode = "prefix+r"
# reload_config = "prefix+shift+r"

[[keys.command]]
key = "prefix+f1"
type = "shell"
description = "Open Pi in sentry"
command = 'pane_id=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME/Projects/sentry" --label sentry --focus | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$pane_id" pi'

[[keys.command]]
key = "prefix+f2"
type = "shell"
description = "Open Pi in sentry2"
command = 'pane_id=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME/Projects/sentry2" --label sentry2 --focus | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$pane_id" pi'

[[keys.command]]
key = "prefix+f3"
type = "shell"
description = "Open Pi in Projects"
command = 'pane_id=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME/Projects" --label Projects --focus | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$pane_id" pi'
